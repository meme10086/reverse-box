<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2740"/>
      <stop offset="1" stop-color="#0e1421"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0b45c"/>
      <stop offset="1" stop-color="#c9803a"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fd0ff"/>
      <stop offset="1" stop-color="#3f8fe0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="104" fill="url(#bg)"/>

  <!-- 时间回溯环 -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#ring)" stroke-width="18"
          stroke-linecap="round" stroke-dasharray="706 236" transform="rotate(-52 256 256)"/>
  <polygon points="118,150 178,132 166,196" fill="#7fd0ff"/>

  <!-- 箱子 -->
  <rect x="176" y="186" width="160" height="160" rx="20" fill="url(#box)"/>
  <rect x="176" y="186" width="160" height="160" rx="20" fill="none" stroke="#8a5522" stroke-width="10"/>
  <line x1="176" y1="240" x2="336" y2="240" stroke="#8a5522" stroke-width="10"/>
  <line x1="176" y1="292" x2="336" y2="292" stroke="#8a5522" stroke-width="10"/>
  <line x1="256" y1="186" x2="256" y2="346" stroke="#8a5522" stroke-width="10"/>
  <rect x="236" y="268" width="40" height="30" rx="6" fill="#ffe0a8" opacity="0.85"/>

  <!-- 地面阴影 -->
  <ellipse cx="256" cy="376" rx="120" ry="18" fill="#000000" opacity="0.35"/>
</svg>
